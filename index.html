    <!-- AUDIO SYNTHESIZER SCRIPT (WEB AUDIO API) -->
    <script>
        let audioCtx = null;
        let audioEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('audioIcon');
            const text = document.getElementById('audioText');
            if (audioEnabled) {
                icon.className = "fa-solid fa-volume-high text-amber-400";
                text.innerText = "Suara: On";
                playHarpSound();
            } else {
                icon.className = "fa-solid fa-volume-xmark text-gray-400";
                text.innerText = "Suara: Off";
            }
        }

        // Synthesize Medieval Sound Effects
        function playHarpSound() {
            if (!audioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const notes = [440, 554.37, 659.25, 880]; // A4, C#5, E5, A5 harp arpeggio
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.06);
                
                gain.gain.setValueAtTime(0.15, now + index * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.06 + 0.6);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.06);
                osc.stop(now + index * 0.06 + 0.6);
            });
        }

        function playCorrectSound() {
            if (!audioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            // Royal Trumpet Chime
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.08);

                gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.7);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.7);
            });
        }

        function playWrongSound() {
            if (!audioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playClickSound() {
            if (!audioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);

            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.08);
        }
    </script>

    <!-- BACKGROUND CANVAS PARTICLES -->
    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 20;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = Math.random() * 0.8 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.7 + 0.2;
                this.color = Math.random() > 0.5 ? '#d4af37' : '#ffb703';
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -10) this.reset();
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#d4af37';
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        for (let i = 0; i < 45; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>

                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    break;

                // SLIDE 12
                case 12:
                    html = `
                        <div class="space-y-3">
                            <div class="text-center">
                                <span class="text-xs font-cinzel text-medieval-crimson font-bold uppercase tracking-widest">Ujian Pemahaman</span>
                                <h2 class="font-cinzel text-xl sm:text-2xl font-extrabold text-medieval-wood">UJIAN KSATRIA BAHASA</h2>
                                <p class="text-xs text-medieval-ink/80">Tentukan jenis majas untuk setiap ungkapan di bawah ini!</p>
                            </div>

                            <div class="space-y-3 max-h-[340px] overflow-y-auto pr-1">
                                ${[
                                    { qId: 1, text: '1. "Ombak berkejaran menuju pantai."' },
                                    { qId: 2, text: '2. "Kakak adalah tulang punggung keluarga."' },
                                    { qId: 3, text: '3. "Aku sudah menunggumu seribu tahun."' },
                                    { qId: 4, text: '4. "Wajahnya bersinar seperti bulan."' }
                                ].map(q => `
                                    <div class="p-3 bg-medieval-woodDark rounded-xl border border-medieval-gold/60 text-amber-100 space-y-2">
                                        <p class="font-medieval text-xs sm:text-sm text-yellow-200">${q.text}</p>
                                        <div class="grid grid-cols-2 gap-1.5">
                                            ${[
                                                { code: 'A', label: 'Metafora' },
                                                { code: 'B', label: 'Personifikasi' },
                                                { code: 'C', label: 'Hiperbola' },
                                                { code: 'D', label: 'Simile' }
                                            ].map(opt => `
                                                <button onclick="selectAnswer(${q.qId}, '${opt.code}')" id="btn-q${q.qId}-${opt.code}" class="quiz-btn-${q.qId} px-2 py-1.5 bg-medieval-wood hover:bg-amber-900 border border-amber-500/40 rounded text-xs font-cinzel text-amber-200 text-left transition flex items-center justify-between">
                                                    <span><strong>${opt.code}.</strong> ${opt.label}</span>
                                                    <i id="icon-q${q.qId}-${opt.code}" class="fa-regular fa-circle text-[10px] text-amber-400"></i>
                                                </button>
                                            `).join('')}
                                        </div>
                                        <div id="feedback-q${q.qId}" class="hidden text-[11px] font-body p-1.5 rounded"></div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="flex items-center justify-between pt-1 border-t border-medieval-border">
                                <span id="quizScoreBadge" class="font-cinzel text-xs font-bold text-medieval-crimson">Skor Kamu: 0 / 4</span>
                                <button onclick="resetQuiz()" class="px-3 py-1 bg-medieval-wood text-amber-200 border border-medieval-gold/40 rounded text-xs font-cinzel hover:bg-amber-950">
                                    <i class="fa-solid fa-rotate-right mr-1"></i> Coba Lagi
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                // SLIDE 13
                case 13:
                    html = `
                        <div class="space-y-4">
                            <div class="text-center">
                                <span class="text-xs font-cinzel text-medieval-crimson font-bold uppercase tracking-widest">Intisari Ilmu</span>
                                <h2 class="font-cinzel text-xl sm:text-3xl font-extrabold text-medieval-wood">GULUNGAN RANGKUMAN</h2>
                            </div>

                            <div class="p-4 bg-parchment-light border-2 border-medieval-border rounded-xl space-y-3 shadow-inner">
                                <div class="flex items-start space-x-2">
                                    <span class="wax-seal w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center text-[10px] text-amber-100 font-bold mt-0.5">1</span>
                                    <p class="text-xs sm:text-sm text-medieval-ink font-body">
                                        <strong class="font-cinzel text-medieval-crimson">Metafora:</strong> Perbandingan dua hal secara langsung tanpa kata pembanding.
                                    </p>
                                </div>
                                <div class="flex items-start space-x-2">
                                    <span class="wax-seal w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center text-[10px] text-amber-100 font-bold mt-0.5">2</span>
                                    <p class="text-xs sm:text-sm text-medieval-ink font-body">
                                        <strong class="font-cinzel text-medieval-crimson">Personifikasi:</strong> Menggambarkan benda mati atau alam seolah berprilaku layaknya manusia.
                                    </p>
                                </div>
                                <div class="flex items-start space-x-2">
                                    <span class="wax-seal w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center text-[10px] text-amber-100 font-bold mt-0.5">3</span>
                                    <p class="text-xs sm:text-sm text-medieval-ink font-body">
                                        <strong class="font-cinzel text-medieval-crimson">Hiperbola:</strong> Ungkapan dilebih-lebihkan untuk memberi impresi dan penekanan mendalam.
                                    </p>
                                </div>
                                <div class="flex items-start space-x-2">
                                    <span class="wax-seal w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center text-[10px] text-amber-100 font-bold mt-0.5">4</span>
                                    <p class="text-xs sm:text-sm text-medieval-ink font-body">
                                        <strong class="font-cinzel text-medieval-crimson">Simile:</strong> Perbandingan eksplisit menggunakan kata penyambung seperti <em>seperti, bagai, laksana, ibarat</em>.
                                    </p>
                                </div>
                            </div>

                            <div class="p-3 bg-medieval-woodDark text-amber-200 rounded-xl text-center border border-medieval-gold/40 text-xs font-medieval">
                                "Menguasai majas membuka pintu keindahan menyelami makna puisi penyair agung!"
                            </div>
                        </div>
                    `;
                    break;

                // SLIDE 14
                case 14:
                    html = `
                        <div class="space-y-4 text-center">
                            <div>
                                <span class="text-xs font-cinzel text-medieval-crimson font-bold uppercase tracking-widest">Sumber Literatur</span>
                                <h2 class="font-cinzel text-2xl sm:text-3xl font-extrabold text-medieval-wood">PUSTAKA AGUNG</h2>
                            </div>

                            <div class="wax-seal w-16 h-16 rounded-full mx-auto flex items-center justify-center text-amber-100 text-2xl shadow-lg border-2 border-yellow-300">
                                <i class="fa-solid fa-book-bookmark"></i>
                            </div>

                            <div class="space-y-3 max-w-lg mx-auto text-left">
                                <div class="p-3 bg-parchment-light border-2 border-medieval-border rounded-xl shadow-sm flex items-start space-x-3">
                                    <i class="fa-solid fa-scroll text-medieval-crimson mt-1 text-sm"></i>
                                    <p class="text-xs sm:text-sm text-medieval-ink font-body leading-relaxed">
                                        <strong>Keraf, Gorys.</strong> (2009). <em>Diksi dan Gaya Bahasa</em>. Jakarta: Gramedia Pustaka Utama.
                                    </p>
                                </div>

                                <div class="p-3 bg-parchment-light border-2 border-medieval-border rounded-xl shadow-sm flex items-start space-x-3">
                                    <i class="fa-solid fa-scroll text-medieval-crimson mt-1 text-sm"></i>
                                    <p class="text-xs sm:text-sm text-medieval-ink font-body leading-relaxed">
                                        <strong>Tarigan, Henry Guntur.</strong> (2013). <em>Pengajaran Gaya Bahasa</em>. Bandung: Angkasa.
                                    </p>
                                </div>
                            </div>

                            <div class="pt-2">
                                <button onclick="goToSlide(1)" class="px-6 py-2.5 bg-medieval-wood hover:bg-amber-950 border border-medieval-gold text-amber-300 rounded-xl font-cinzel text-xs sm:text-sm font-bold transition">
                                    <i class="fa-solid fa-arrow-rotate-left mr-2"></i> Ulang Petualangan Dari Awal
                                </button>
                            </div>
                        </div>
                    `;
                    break;

                default:
                    html = `<div>Slide tidak ditemukan.</div>`;
            }

            container.innerHTML = html;
            updateUIState();
            
            // Restore quiz visual state if on slide 12
            if (slideNum === 12) {
                restoreQuizUI();
            }
        }

        function updateUIState() {
            document.getElementById('currentSlideNum').innerText = currentSlide;
            document.getElementById('slideTitleMini').innerText = slidesData[currentSlide - 1].title;
            
            // Progress Bar
            const percentage = (currentSlide / totalSlides) * 100;
            document.getElementById('progressBar').style.width = `${percentage}%`;

            // Prev & Next Button states
            document.getElementById('prevBtn').disabled = (currentSlide === 1);
            document.getElementById('nextBtn').disabled = (currentSlide === totalSlides);
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                currentSlide++;
                playHarpSound();
                renderSlide(currentSlide);
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                currentSlide--;
                playHarpSound();
                renderSlide(currentSlide);
            }
        }

        function goToSlide(num) {
            if (num >= 1 && num <= totalSlides) {
                currentSlide = num;
                playHarpSound();
                renderSlide(currentSlide);
                closeSlideMap();
            }
        }

        // Slide Map Modal Functions
        function openSlideMap() {
            playClickSound();
            const modal = document.getElementById('slideMapModal');
            const grid = document.getElementById('slideMapGrid');
            
            grid.innerHTML = slidesData.map(s => `
                <button onclick="goToSlide(${s.id})" class="p-2.5 rounded-xl text-left border transition ${s.id === currentSlide ? 'bg-medieval-crimson text-yellow-200 border-amber-400' : 'bg-medieval-woodDark/80 hover:bg-amber-950 text-amber-300 border-medieval-gold/30'} flex items-center space-x-2">
                    <span class="wax-seal w-6 h-6 rounded-full flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-amber-100">${s.id}</span>
                    <span class="font-cinzel text-xs font-semibold truncate">${s.title}</span>
                </button>
            `).join('');

            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeSlideMap() {
            const modal = document.getElementById('slideMapModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // SLIDE SPECIFIC INTERACTION HELPERS
        function toggleShieldCard(id) {
            playClickSound();
            const el = document.getElementById(`shieldText-${id}`);
            if (el) {
                el.classList.toggle('font-bold');
                el.classList.toggle('text-medieval-crimson');
            }
        }

        function toggleBedahMajas3() {
            playClickSound();
            const content = document.getElementById('bedahMajas3Content');
            if (content) content.classList.toggle('hidden');
        }

        function flipCardSlide4(idx) {
            playClickSound();
            const cardInner = document.getElementById(`cardInner-${idx}`);
            if (cardInner) {
                cardInner.classList.toggle('flipped');
            }
        }

        function toggleModalMetafora() {
            playClickSound();
            const el = document.getElementById('metaforaDetail');
            if (el) el.classList.toggle('hidden');
        }

        function updateHyperboleSlider(val) {
            const valSpan = document.getElementById('yearsVal');
            const labelSpan = document.getElementById('sliderYearsText');
            if (valSpan) valSpan.innerText = val;
            if (labelSpan) labelSpan.innerText = `Skala: ${val} Tahun`;
        }

        function highlightSimileWord(word) {
            playClickSound();
            const target = document.getElementById('simileHighlightTarget');
            if (target) {
                target.innerText = word;
                target.classList.add('scale-110', 'text-amber-300');
                setTimeout(() => target.classList.remove('scale-110'), 300);
            }
        }

        function analyzePoemLine(lineNum) {
            playClickSound();
            const el = document.getElementById(`poemAnalysis-${lineNum}`);
            if (el) {
                el.classList.toggle('hidden');
            }
        }

        function highlightStep(stepNum) {
            playClickSound();
        }

        // QUIZ SYSTEM LOGIC
        function selectAnswer(qId, selectedOption) {
            quizAnswers[qId] = selectedOption;
            const isCorrect = (selectedOption === correctQuizAnswers[qId]);

            if (isCorrect) {
                playCorrectSound();
            } else {
                playWrongSound();
            }

            restoreQuizUI();
        }

        function restoreQuizUI() {
            let correctCount = 0;

            for (let qId = 1; qId <= 4; qId++) {
                const selected = quizAnswers[qId];
                const correctOpt = correctQuizAnswers[qId];
                const feedbackEl = document.getElementById(`feedback-q${qId}`);

                // Clear buttons styling
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    const btn = document.getElementById(`btn-q${qId}-${opt}`);
                    const icon = document.getElementById(`icon-q${qId}-${opt}`);
                    if (!btn) return;

                    btn.className = `quiz-btn-${qId} px-2 py-1.5 bg-medieval-wood hover:bg-amber-900 border border-amber-500/40 rounded text-xs font-cinzel text-amber-200 text-left transition flex items-center justify-between`;
                    icon.className = "fa-regular fa-circle text-[10px] text-amber-400";

                    if (selected) {
                        if (opt === correctOpt) {
                            btn.className = `quiz-btn-${qId} px-2 py-1.5 bg-emerald-900 border-2 border-emerald-400 rounded text-xs font-cinzel text-emerald-100 text-left transition flex items-center justify-between`;
                            icon.className = "fa-solid fa-circle-check text-[10px] text-emerald-300";
                        } else if (opt === selected) {
                            btn.className = `quiz-btn-${qId} px-2 py-1.5 bg-red-950 border-2 border-red-500 rounded text-xs font-cinzel text-red-200 text-left transition flex items-center justify-between`;
                            icon.className = "fa-solid fa-circle-xmark text-[10px] text-red-400";
                        }
                    }
                });

                if (selected) {
                    if (selected === correctOpt) {
                        correctCount++;
                        if (feedbackEl) {
                            feedbackEl.className = "text-[11px] font-body p-1.5 rounded bg-emerald-950/80 border border-emerald-500/40 text-emerald-200";
                            feedbackEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Tepat Sekali, Ksatria! (Jawaban: ${correctOpt})`;
                            feedbackEl.classList.remove('hidden');
                        }
                    } else {
                        if (feedbackEl) {
                            feedbackEl.className = "text-[11px] font-body p-1.5 rounded bg-red-950/80 border border-red-500/40 text-red-200";
                            feedbackEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400 mr-1"></i> Kurang Tepat. Jawaban Benar adalah: ${correctOpt}`;
                            feedbackEl.classList.remove('hidden');
                        }
                    }
                }
            }

            const scoreBadge = document.getElementById('quizScoreBadge');
            if (scoreBadge) {
                scoreBadge.innerText = `Skor Kamu: ${correctCount} / 4`;
            }
        }

        function resetQuiz() {
            playClickSound();
            for (let qId in quizAnswers) {
                quizAnswers[qId] = null;
            }
            restoreQuizUI();
        }

        // TOUCH SWIPE NAVIGATION FOR MOBILE (ANDROID & IOS)
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                // Swipe Left -> Next
                nextSlide();
            }
            if (touchEndX > touchStartX + threshold) {
                // Swipe Right -> Prev
                prevSlide();
            }
        }

        // INITIALIZE APP ON LOAD
        window.onload = function() {
            renderSlide(1);
        };
    </script>
</body>
</html>
