    <style>
        /* Custom Medieval Parchment & Gold Styling */
        body {
            background-color: #0f0a06;
            color: #2c1d11;
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Parchment Background Texture */
        .parchment-bg {
            background: #f4ecd8;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.4) 0%, rgba(0, 0, 0, 0.05) 100%),
                linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
            box-shadow: inset 0 0 100px rgba(74, 51, 25, 0.4), 0 10px 30px rgba(0,0,0,0.8);
            border: 3px solid #d4af37;
        }

        /* Golden Carved Ornate Border */
        .medieval-border {
            border: 4px solid #d4af37;
            outline: 2px solid #4a3319;
            outline-offset: -8px;
            position: relative;
        }

        .medieval-border::before, .medieval-border::after {
            content: '✦';
            position: absolute;
            color: #d4af37;
            font-size: 1.5rem;
            z-index: 10;
        }
        .medieval-border::before { top: 2px; left: 6px; }
        .medieval-border::after { top: 2px; right: 6px; }

        /* Canvas Particle Canvas Overlay */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Flip Card Styles */
        .flip-card {
            perspective: 1000px;
            height: 220px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.25rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* Red Wax Seal Decorative Badge */
        .wax-seal {
            background: radial-gradient(circle at 30% 30%, #b81414, #660000);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #f4ecd8;
        }

        /* Audio Control Equalizer Bar Animation */
        .eq-bar {
            width: 3px;
            background-color: #d4af37;
            animation: eqAnim 1s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1) { height: 12px; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 8px;  animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { height: 15px; animation-delay: 0.4s; }

        @keyframes eqAnim {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.1); }
        }

        .paused .eq-bar {
            animation-play-state: paused;
            height: 4px !important;
        }

        /* Custom Scrollbar for inner boxes */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2d4b7;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #8b0000;
            border-radius: 4px;
        }

        /* Pulsing Glow Effect */
        .gold-glow {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* Slide Animation */
        .slide-content {
            animation: fadeInSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

        function initParticleCanvas() {

            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = [];
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.5 + 0.5,
                    alpha: Math.random() * 0.6 + 0.2,
                    speedY: Math.random() * 0.5 + 0.1,
                    speedX: (Math.random() - 0.5) * 0.3
                });
            }

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#d4af37';
                    ctx.fill();

                    p.y -= p.speedY;
                    p.x += p.speedX;

                    if (p.y < 0) {
                        p.y = height + 10;
                        p.x = Math.random() * width;
                    }
                });

                requestAnimationFrame(animateParticles);
            }

            animateParticles();
        }

        // Initialize application when DOM is ready
        window.onload = initApp;
    </script>
</body>
</html>
